<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Journal</h1>
            <div class="action-buttons">
                <!-- Tillfällig import och export -->
                <button id="exportBtn" class="action-btn">Exportera</button>
                <button id="importBtn" class="action-btn">Importera</button>
                <input type="file" id="importFile" accept=".json" style="display: none;" />
            </div>
        </header>

        <main class="app-main">
            <!-- Din befintliga antecknings- eller journalvy -->
            <section class="editor-section">
                <textarea id="journalInput" placeholder="Skriv dina tankar här..."></textarea>
                <button id="saveBtn" class="primary-btn">Spara Inlägg</button>
            </section>

            <section class="entries-section">
                <h2>Tidigare inlägg</h2>
                <div id="entriesList"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
